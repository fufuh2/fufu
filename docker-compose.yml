# Local development stack. Not verified in the authoring environment (no Docker daemon there).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: opsx
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d opsx"]
      interval: 5s
      retries: 10
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      OPSX_DATABASE_URL: postgresql+psycopg://ops:${POSTGRES_PASSWORD}@db:5432/opsx
      OPSX_JWT_SECRET: ${OPSX_JWT_SECRET:?set OPSX_JWT_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./backend
    environment:
      OPSX_DATABASE_URL: postgresql+psycopg://ops:${POSTGRES_PASSWORD}@db:5432/opsx
      OPSX_JWT_SECRET: ${OPSX_JWT_SECRET}
      OPSX_ENV: ${OPSX_ENV:-development}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  pgdata:
