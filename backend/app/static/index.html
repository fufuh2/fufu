<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taff Burger · İşletme Yönetimi</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
  <script src="count.js" defer></script>
  <script src="panel.js" defer></script>
  <script src="admin.js" defer></script>
  <script src="menu.js" defer></script>
  <script src="erp.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">İçeriğe geç</a>
  <div class="shell" id="shell">
    <aside class="side" id="side" hidden>
      <div class="brand"><span class="logo" aria-hidden="true">TB</span><span><strong>Taff Burger</strong><small>İşletme Yönetimi</small></span></div>
      <label class="branch">Şube
        <select id="branch-select" aria-label="Şube seç"></select>
      </label>
      <nav aria-label="Ana menü">
        <ul id="nav">
          <li><a href="#/panel" data-perm="count.read">Panel</a></li>
          <li><a href="#/sayim" data-perm="count.read">Aylık Sayım</a></li>
          <li><a href="#/gecmis" data-perm="count.read">Geçmiş Aylar</a></li>
          <li><a href="#/analiz" data-perm="count.read">Ürün Analizi</a></li>
          <li><a href="#/urunler" data-perm="count.read">Ürün Listesi</a></li>
          <li><a href="#/receteler" data-perm="count.read">Menü &amp; Reçeteler</a></li>
          <li class="section" data-section="business">İşletme</li>
          <li><a href="#/satislar" data-perm="sales.manage|finance.read">Satışlar</a></li>
          <li><a href="#/satin-alma" data-perm="purchase.manage|finance.read">Satın Alma</a></li>
          <li><a href="#/giderler" data-perm="expense.manage|finance.read">Giderler</a></li>
          <li><a href="#/personel" data-perm="staff.manage|finance.read">Personel</a></li>
          <li><a href="#/kar-zarar" data-perm="finance.read">Kâr-Zarar</a></li>
          <li class="section" data-section="admin">Yönetim</li>
          <li><a href="#/kullanicilar" data-perm="user.manage">Kullanıcılar</a></li>
          <li><a href="#/subeler" data-perm="branch.manage">Şubeler</a></li>
          <li><a href="#/kayitlar" data-perm="audit.read">Kayıt Geçmişi</a></li>
          <li><a href="#/hesap">Hesabım</a></li>
        </ul>
      </nav>
    </aside>
    <div class="content">
      <header class="top" id="top" hidden>
        <button type="button" class="menu-toggle secondary" id="menu-toggle" aria-controls="side" aria-expanded="false">Menü</button>
        <span id="whoami" class="who"></span>
        <button type="button" class="secondary" id="logout" title="Bu kullanıcının tüm cihazlardaki oturumlarını kapatır">Çıkış</button>
      </header>
      <div id="msg" class="msg" role="status" aria-live="polite"></div>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
</body>
</html>
