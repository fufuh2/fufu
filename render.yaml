# Render blueprint (infrastructure as code). The live services were created from the same
# settings through the Render API; secrets are generated by Render, never stored in git.
databases:
  - name: opsx-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: opsx-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.lock
    # Migrations run before the server starts; a failed migration stops the deploy.
    # bootstrap-if-empty creates the first owner only when OPSX_BOOTSTRAP_* are set and no tenant exists.
    startCommand: alembic upgrade head && python -m app.cli bootstrap-if-empty && uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /readyz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: OPSX_ENV
        value: production
      - key: OPSX_DATABASE_URL
        fromDatabase:
          name: opsx-db
          property: connectionString
      - key: OPSX_JWT_SECRET
        generateValue: true
      - key: OPSX_INTEGRATION_KEY
        generateValue: true
