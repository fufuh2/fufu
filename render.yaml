# Render blueprint (infrastructure as code). The live services were created from the same
# settings through the Render API; secrets are generated by Render, never stored in git.
databases:
  - name: opsx-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: opsx-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.lock
    # app.serve: migrations (a failure stops the start), copy-from-if-empty, bootstrap-if-empty
    # and uvicorn in one process, so a cold start imports the app once.
    startCommand: python -m app.serve
    healthCheckPath: /readyz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: OPSX_ENV
        value: production
      - key: OPSX_DATABASE_URL
        fromDatabase:
          name: opsx-db
          property: connectionString
      - key: OPSX_JWT_SECRET
        generateValue: true
